# Configuración compartida por los tres nodos del lab.
# Todo lo que está bajo [regtest] solo aplica en regtest.
regtest=1

[regtest]
# Aceptar conexiones de los otros nodos del lab.
listen=1
# Fee por defecto para la wallet: en regtest no hay estimación de fees.
fallbackfee=0.0002
# ZMQ: el nodo publica eventos en estos puertos.
zmqpubsequence=tcp://0.0.0.0:28332
zmqpubrawtx=tcp://0.0.0.0:28333
zmqpubhashblock=tcp://0.0.0.0:28334
